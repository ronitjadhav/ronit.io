version: 2
updates:
  # Monthly, and only releases at least a week old: a compromised version is
  # usually caught and pulled within days. Security updates ignore both and
  # arrive at once.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One PR for all routine minor/patch bumps; majors get their own PR each,
      # since those are the ones that need a human to read a changelog.
      minor-and-patch:
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint does not support TS 7 yet (typescript-eslint#10940).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-react inside eslint-config-next still calls the
      # context.getFilename() API that ESLint 10 removed.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      # Track the Node major the workflows use, not the newest @types/node major.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
